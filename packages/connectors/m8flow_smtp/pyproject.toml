[project]
name = "node-wire-m8flow-smtp"
version = "1.1.0"
description = "Node Wire connector — SMTP mail with HTML bodies and attachments (M8Flow contract)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]

dependencies = [
    "node-wire-runtime>=1.1.0",
]

[project.entry-points."node_wire.connectors"]
m8flow_smtp = "node_wire_m8flow_smtp.logic"

[build-system]
requires = ["setuptools>=69.0.0", "cython>=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../../src"]
include = ["node_wire_m8flow_smtp*"]
